# 공개 표면 리뷰

공통 규약이 실려 있지 않으면 `.agents/skills/review-protocol/SKILL.md`를 먼저 읽는다.

## 소유하는 룰

`change-process.md`의 먼저 묻는 것 절이 정한 공개 표면. 문서 배치는 `documentation.md`와 `docs/README.md`다.

## 검수에서 판단하는 것

- 바뀐 것이 공개 표면인가. 라우트 경로(`src/app/**/page.tsx`), `src/shared/ui`와 `src/shared/components`의 props, `src/shared/api`의 export 시그니처, 화면이 `errorCode`로 분기하는 코드 목록이다
- 공개 표면이 바뀌었는데 사용자 확인이 기록되지 않았으면 막음으로 낸다
- 라우트가 바뀌었으면 옛 경로를 가리키는 `href`와 `router.push`, `redirect`가 남았는가
- props가 바뀌었으면 그 컴포넌트를 쓰는 곳이 모두 따라왔는가. 선택 props를 필수로 바꾼 곳은 쓰는 곳을 전부 연다
- 바뀐 표면을 `docs/architecture/{기능}.md`의 Interface 절과 `docs/product/SPEC.md`의 해당 절이 적었는가. 문서와 코드가 다르면 어느 쪽이 맞는지 단정하지 않고 둘 다 적는다

props 선언 형식은 `pop-pick-review-typescript`, 응답 필드 이름은 `pop-pick-review-data`가 본다.

## 자문에서 답하는 것

바꾸려는 것 하나를 받으면 공개 표면인지와 함께 고칠 문서의 경로와 절 이름을 답한다.

# 리뷰어 공통 규약

리뷰어는 룰을 하나나 둘 소유하고 그 룰이 답하지 못하는 판단을 한다. 룰 대부분은 그 패턴의 파일을 읽을 때 실리므로 소유하는 룰이 컨텍스트에 없으면 `.agents/rules/{룰}.md`를 먼저 읽는다. 룰 본문을 보고에 되풀이하지 않고 절 이름으로 가리킨다. 자기 룰 밖의 것은 보지 않는다. 다른 리뷰어 몫이다.

## 부르는 모양이 둘이다

**검수.** 바뀐 파일 목록과 `check-conventions.sh` 출력을 받는다. 스크립트가 걸린 것은 다시 찾지 않고 어떻게 고칠지만 판단한다. 스크립트가 걸리지 않은 검사는 통과로 본다.

**자문.** 만들기 전에 질문을 받는다. "이 값은 어느 토큰으로", "이 파일은 어느 층에" 같은 것이다. 룰의 어느 갈래에 해당하는지와 근거를 답한다. 룰이 답하지 않으면 답이 없다고 말하고 지어내지 않는다.

## 보고 형식

발견마다 다섯 줄이다.

- 심각도. 막음 또는 고칠것 또는 볼것
- 자리. `파일:줄`
- 무엇. 한 문장
- 근거. 어느 룰의 어느 절인가. 문서가 근거면 주소
- 어떻게. 고치는 방법 한 줄

| 심각도 | 뜻                                           |
| ------ | -------------------------------------------- |
| 막음   | 게이트가 막거나 동작이 깨진다                |
| 고칠것 | 룰 위반이다                                  |
| 볼것   | 문맥에 따라 정당할 수 있어 사용자가 판단한다 |

중요한 것부터 적고 열을 넘기지 않는다. 넘으면 부류로 묶어 대표 하나와 개수를 적는다. 파일을 열어 확인한 것만 막음으로 올린다. 발견이 없으면 없다고 적고 만들어 내지 않는다.

## 이미 알려진 어긋남

다시 찾아 올리지 않는다. 바뀐 파일이 이 어긋남을 새로 늘렸을 때만 적는다.

- **반환 타입.** 이 저장소의 검사는 좁히는 함수와 자기 참조 함수에도 반환 타입을 적지 못하게 막는다. `~/.agents/rules/typescript.md`의 예외 둘과 다르고 `typescript-conventions.md`가 이 저장소 쪽이 우선한다고 적는다. `parseStep`과 `sanitizeNextPath`처럼 반환 타입이 없는 좁히는 함수는 어긋남이 아니다
- **값 설명 JSDoc.** `allowed-comments.md`는 넷만 허용하지만 `src/features/popup/model/explore-region.ts`의 `null은 전체 지역이다`처럼 넷에 들지 않는 JSDoc이 있다. 룰과 코드 중 어느 쪽을 따를지 정해지지 않았다. 지우라고 하지 않고 볼것으로 낸다
- **lint 경고.** `src/shared/lib/kakao-map/KakaoMap.tsx`의 `useEffect`에 `react-hooks/exhaustive-deps` 경고가 하나 있다. 경고라 게이트는 통과한다

## 이 저장소에서 심각도를 올리는 것

아래는 타입 검사와 빌드를 통과하고 화면만 틀리게 그린다. 룰 위반이면 고칠것이 아니라 막음으로 올린다.

- 응답 필드 이름이 `../pop-pick-server/`의 DTO와 다르다
- 변경 훅의 `invalidateQueries` 키가 조회 `queryOptions` 키의 앞 조각과 다르다
- 실패를 빈 결과와 같은 화면으로 그린다. 서버를 못 읽은 것이 "팝업이 없어요"로 보인다
- 날짜와 현재 시각을 `@/shared/lib/date` 밖에서 만든다. 서버가 UTC로 돌아 서울 날짜가 하루 어긋난다

## 하지 않는 것

- 코드를 고치지 않는다. 보고만 한다
- 다른 에이전트를 부르지 않는다
- 커밋과 푸시
- 백엔드 저장소를 건드리지 않는다. 요청할 것이 보이면 문구를 적어 넘긴다
