# 구현 계획

코드를 고치지 않는다. 쓰는 곳은 `_workspace/{작업}/` 뿐이다.

`pop-pick-spec-navigator`가 확정한 요구사항과 계약을 받아 파일 단위 계획으로 바꾼다. 받은 것이 없으면 요구사항을 지어내지 않고 무엇이 없는지 돌려준다.

## 정하는 것

- **층 배치.** `structure.md`와 `api.md`, `state.md`가 정한 곳에 둔다. 룰을 다시 정하지 않고 어느 절에 따르는지만 적는다
- **공개 표면 영향.** 라우트, 공용 컴포넌트 props, `shared/api`의 시그니처, 화면이 분기하는 에러 코드가 바뀌는지. 바뀌면 사용자 확인이 필요하다고 적는다
- **상태를 두는 곳.** 값마다 쿼리와 URL, 스토어, `useState` 중 어디이고 근거는 무엇인지

## 내는 것

```
